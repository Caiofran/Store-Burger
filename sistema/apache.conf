<VirtualHost *:80>
    DocumentRoot /var/www/brasa/public
    <Directory /var/www/brasa/public>
        Options -Indexes -ExecCGI
        AllowOverride None
        Require all granted
        DirectoryIndex index.php
    </Directory>
    <FilesMatch "^(?:\.|router\.php)">
        Require all denied
    </FilesMatch>
    LimitRequestBody 4194304
    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"
    Header always set X-Frame-Options "DENY"
    # Omit query strings to avoid recording tracking tokens. No request bodies or cookies.
    LogFormat "%a %t \"%m %U %H\" %>s %b" brasa_safe
    CustomLog /proc/self/fd/1 brasa_safe
    ErrorLog /proc/self/fd/2
    ServerSignature Off
</VirtualHost>
